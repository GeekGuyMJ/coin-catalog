<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    var path = window.location.pathname + window.location.search + window.location.hash;
    // Do not redirect API paths — they should return 404 (or be intercepted by the app)
    if (path.startsWith('/api/')) {
      document.body.innerHTML = 'API endpoint not found';
      return;
    }
    var domain = 'https://geekguymj.github.io/coin-catalog/app/';
    var redirect = domain + path.replace(/^\//, '');
    window.location.replace(redirect);
  </script>
</head>
<body>
  Redirecting to <a id="redirect" href="">the app</a>...
</body>
</html>
